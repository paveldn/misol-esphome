# Text sensor for light intensity
# Depends on the light sensor from the misol_weather integration
text_sensor:
  - platform: template
    name: "${device_name} Light Intensity Text"
    id: ${device_id}_light_intensity_text
    icon: "mdi:weather-sunny"
    update_interval: 20s
    lambda: |-
      static int previous_level = -1;
      static constexpr const char *LABELS[] = {
          "Dark night", "Night", "Twilight", "Very dark day",
          "Overcast day", "Daylight", "Bright daylight", "Direct sunlight"};
      static constexpr float THRESHOLDS[] = {
          1.0f, 10.0f, 100.0f, 1000.0f, 10000.0f, 25000.0f, 100000.0f};
      static constexpr int LEVEL_COUNT = sizeof(LABELS) / sizeof(LABELS[0]);
      static constexpr float HYSTERESIS = 0.15f;

      if (!id(${device_id}_light).has_state()) {
        return { "Unknown" };
      }

      const float lux = id(${device_id}_light).state;
      if (std::isnan(lux)) {
        previous_level = -1;
        return { "Unknown" };
      }

      int level = 0;
      while (level < LEVEL_COUNT - 1 && lux >= THRESHOLDS[level]) {
        level++;
      }

      if (previous_level >= 0) {
        const bool above_lower = previous_level == 0 ||
                                 lux >= THRESHOLDS[previous_level - 1] * (1.0f - HYSTERESIS);
        const bool below_upper = previous_level == LEVEL_COUNT - 1 ||
                                 lux < THRESHOLDS[previous_level] * (1.0f + HYSTERESIS);
        if (above_lower && below_upper) {
          level = previous_level;
        }
      }

      previous_level = level;
      return { LABELS[level] };
