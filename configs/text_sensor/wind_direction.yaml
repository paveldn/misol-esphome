# Text sensor for wind direction, with 8-point or 16-point compass directions
# Depends on the wind direction sensor from the misol_weather integration
text_sensor:
  - platform: template
    name: "${device_name} Wind Direction Text"
    id: ${device_id}_wind_direction_text
    icon: "mdi:compass"
    update_interval: 20s
    lambda: |-
      static constexpr bool USE_16_DIRECTIONS = false;
      static constexpr const char *DIRECTIONS_16[] = {
          "N", "NNE", "NE", "ENE",
          "E", "ESE", "SE", "SSE",
          "S", "SSW", "SW", "WSW",
          "W", "WNW", "NW", "NNW"};
      static constexpr int STEP = USE_16_DIRECTIONS ? 1 : 2;
      static constexpr int SECTOR_COUNT = USE_16_DIRECTIONS ? 16 : 8;
      static constexpr float SECTOR_SIZE = 360.0f / SECTOR_COUNT;
      static constexpr float HYSTERESIS_DEGREES = 5.0f;
      static int previous_sector = -1;

      if (!id(${device_id}_wind_direction).has_state()) {
        return { "Unknown" };
      }

      float angle = std::fmod(id(${device_id}_wind_direction).state, 360.0f);
      if (std::isnan(angle)) {
        previous_sector = -1;
        return { "Unknown" };
      }
      if (angle < 0.0f) {
        angle += 360.0f;
      }

      int sector = static_cast<int>((angle + SECTOR_SIZE / 2.0f) / SECTOR_SIZE) % SECTOR_COUNT;

      if (previous_sector >= 0) {
        const float center = previous_sector * SECTOR_SIZE;
        float distance = std::fabs(angle - center);
        if (distance > 180.0f) {
          distance = 360.0f - distance;
        }
        if (distance <= SECTOR_SIZE / 2.0f + HYSTERESIS_DEGREES) {
          sector = previous_sector;
        }
      }

      previous_sector = sector;
      return { DIRECTIONS_16[sector * STEP] };
