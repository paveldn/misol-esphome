# Text sensor for light intensity
# Depend on the light sensor from the misol_weather integration
text_sensor:
  - platform: template
    name: "${device_name} Weather Conditions"
    id: ${device_id}_weather_conditions_text
    icon: "mdi:weather-partly-cloudy"
    update_interval: 20s
    lambda: |-
      const bool has_temperature = id(${device_id}_temperature).has_state();
      const bool has_humidity = id(${device_id}_humidity).has_state();
      const bool has_wind = id(${device_id}_wind_speed).has_state();
      const bool has_rain = id(${device_id}_precipitation_intensity).has_state();
      const bool has_light = id(${device_id}_light).has_state();
      const bool has_uv = id(${device_id}_uv_intensity).has_state();

      if (!has_temperature && !has_humidity && !has_wind && !has_rain && !has_light && !has_uv) {
        return { "Unknown" };
      }

      const float temperature = has_temperature ? id(${device_id}_temperature).state : NAN;
      const float humidity = has_humidity ? id(${device_id}_humidity).state : NAN;
      const float wind_speed = has_wind ? id(${device_id}_wind_speed).state : NAN;
      const float rain_intensity = has_rain ? id(${device_id}_precipitation_intensity).state : NAN;
      const float lux = has_light ? id(${device_id}_light).state : NAN;
      const float uv = has_uv ? id(${device_id}_uv_intensity).state : NAN;

      if (!std::isnan(rain_intensity) && rain_intensity > 0.0f) {
        if (!std::isnan(temperature) && temperature <= 0.0f) {
          return { "Wintry Precipitation" };
        }
        if (rain_intensity >= 50.0f) {
          return { "Violent Rain" };
        }
        if (rain_intensity >= 7.6f) {
          return { "Heavy Rain" };
        }
        if (rain_intensity >= 2.5f) {
          return { "Moderate Rain" };
        }
        return { "Light Rain" };
      }

      if (!std::isnan(humidity) && humidity >= 95.0f &&
          (std::isnan(wind_speed) || wind_speed <= 3.0f) &&
          (std::isnan(lux) || lux < 10000.0f)) {
        return { "Foggy" };
      }

      if (!std::isnan(wind_speed)) {
        if (wind_speed >= 20.8f) {
          return { "Stormy" };
        }
        if (wind_speed >= 10.8f) {
          return { "Windy" };
        }
      }

      const bool likely_night = (!std::isnan(lux) && lux < 50.0f) || (std::isnan(lux) && !std::isnan(uv) && uv < 0.2f);
      if (likely_night) {
        return { "Night" };
      }

      if (!std::isnan(lux)) {
        if (lux < 4500.0f) {
          return { "Overcast" };
        }
        if (lux < 28500.0f) {
          return { "Cloudy" };
        }
        return { "Clear" };
      }

      if (!std::isnan(temperature)) {
        if (temperature >= 30.0f) {
          return { "Hot" };
        }
        if (temperature <= 0.0f) {
          return { "Freezing" };
        }
      }

      return { "Unknown" };
